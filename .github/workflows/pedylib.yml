name: PE to signed dylib conversion (farms)

# engine/pedylib/pe2dylib.py over Madeira's real DLL farms at the pin (engine/wine/PIN), in a
# few minutes instead of an IPA build: how many files convert with --strict, why the others do
# not, and a disassembly of a rewritten aarch64 syscall thunk (docs/NO_JIT_WOW64.md, stage 1).
on:
  push:
    branches: ["main", "claude/**"]
    paths: ["engine/pedylib/pe2dylib.py", ".github/workflows/pedylib.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu > /dev/null
      - name: Madeira's DLL farms at the pin
        run: |
          . engine/wine/PIN
          git init -q "$RUNNER_TEMP/md"
          cd "$RUNNER_TEMP/md"
          git remote add origin "$MADEIRA_REPO"
          git sparse-checkout set --no-cone app/Madeira/aarch64-windows app/Madeira/arm64ec-windows
          git fetch -q --depth 1 origin "$MADEIRA_SHA" && git checkout -q FETCH_HEAD
          ls app/Madeira/aarch64-windows | wc -l; ls app/Madeira/arm64ec-windows | wc -l
      - name: Convert every file (--strict)
        run: |
          set -o pipefail
          {
            echo "## pe2dylib over Madeira's farms"
            for farm in aarch64-windows arm64ec-windows; do
              ok=0; bad=0; fails=""
              mkdir -p "$RUNNER_TEMP/out/$farm"
              for f in "$RUNNER_TEMP/md/app/Madeira/$farm"/*; do
                n=$(basename "$f")
                case "$n" in xtajit.dll|xtajit64.dll) continue ;; esac
                if out=$(python3 engine/pedylib/pe2dylib.py convert --strict --keep-ext "$f" "$RUNNER_TEMP/out/$farm" 2>&1); then
                  ok=$((ok + 1))
                  lit=$(grep -m1 '^code literals' <<< "$out" || true)
                  [ -n "$lit" ] && echo "- $farm/$n: $lit"
                else
                  bad=$((bad + 1)); fails="$fails\n  - $n: $(tail -1 <<< "$out")"
                fi
              done
              echo "- **$farm: $ok converted, $bad not**$(printf "$fails")"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A rewritten syscall thunk (aarch64 ntdll)
        run: |
          T="$RUNNER_TEMP/out/aarch64-windows/ntdll.dll.text.img"
          [ -f "$T" ] || { echo "ntdll did not convert"; exit 1; }
          # The first syscall thunks of the export table sit at 0x64c20 in the pinned ntdll.
          aarch64-linux-gnu-objdump -D -b binary -m aarch64 --start-address=0x64c20 --stop-address=0x64c60 "$T" | tail -18 \
            | tee -a "$GITHUB_STEP_SUMMARY"
