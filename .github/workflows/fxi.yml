name: FXI interpreter

# Builds the FXI x86-64 interpreter for the Linux CI host and runs the guest
# test programs natively and under FXI: checksums must match, and the job
# summary shows FXI's speed as a percentage of native.
on:
  push:
    branches: [main]
    paths: ["engine/fxi/**", "engine/guest/**", ".github/workflows/fxi.yml"]
  pull_request:
    paths: ["engine/fxi/**", "engine/guest/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fxi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang xxd > /dev/null
          clang --version | head -1
      - name: Guest programs
        run: bash engine/guest/build.sh "$RUNNER_TEMP/guests"
      - name: Build FXI
        run: bash engine/fxi/build.sh "$RUNNER_TEMP/fxi"
      - name: Native vs FXI
        run: bash engine/fxi/ci-test.sh "$RUNNER_TEMP/guests" "$RUNNER_TEMP/fxi/fxi"
      # Static to-do list for Windows x64 code: every function in .pdata decoded by FXI.
      # Madeira's own x64 test programs, at the pinned commit (engine/wine/PIN).
      - name: Scan Windows x64 test programs
        if: always()
        run: |
          . engine/wine/PIN
          mkdir -p "$RUNNER_TEMP/pe"
          for exe in hello-x64 fib-x64 clocktest-x64 heap-x64 fileio-x64 calltest-x64 fpconf-x64 child-test-x64 cube-x64 d3d12-cube-x64; do
            curl -fsSL -o "$RUNNER_TEMP/pe/$exe.exe" \
              "https://raw.githubusercontent.com/willfaust/Madeira/$MADEIRA_SHA/app/Madeira/arm64ec-windows/$exe.exe" || echo "no $exe"
          done
          { echo "## FXI static scan of Windows x64 programs"; echo; } >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/fxi/fxi" --scan-pe "$RUNNER_TEMP"/pe/*.exe | tee -a "$GITHUB_STEP_SUMMARY"

  # FXI32: FXI's sources built for i386 guests (docs/NO_JIT_WOW64.md, stage 2). i686 static guests
  # run natively on the x86-64 runner and under fxi32 inside a 4 GB guest window: output must match.
  fxi32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang gcc-multilib > /dev/null
          clang --version | head -1
      - name: i386 guest programs
        run: bash engine/guest/build32.sh "$RUNNER_TEMP/guests32"
      - name: Build FXI32 (and check its symbols are renamed)
        run: bash engine/fxi32/build.sh "$RUNNER_TEMP/fxi32"
      - name: Native vs FXI32
        run: bash engine/fxi32/ci-test.sh "$RUNNER_TEMP/guests32" "$RUNNER_TEMP/fxi32/fxi32"
      # The to-do list for 32-bit Windows code: Wine's i386 system DLLs and DXMT's i386 D3D DLLs
      # (the newest wine-i386.yml farm for this branch, else main's), every reachable function.
      - name: Scan the i386 Windows farm
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(bash tools/latest-run.sh wine-i386.yml || true)
          [ -n "$RUN" ] || { echo "no i386 farm yet"; exit 0; }
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n wine-i386-farm -D "$RUNNER_TEMP/farm32"
          { echo "## FXI32 static scan of the i386 Windows farm (run $RUN)"; echo; } >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/farm32"
          "$RUNNER_TEMP/fxi32/fxi32" --scan-pe ntdll.dll kernelbase.dll kernel32.dll user32.dll gdi32.dll msvcrt.dll \
            ucrtbase.dll d3d11.dll dxgi.dll winemetal.dll hello-x86.exe | tee -a "$GITHUB_STEP_SUMMARY"
