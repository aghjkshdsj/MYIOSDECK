name: Stage 2 - Wine unix side

# Builds Wine's unix side for iOS (ntdll, win32u, wineserver) as static
# libraries from Madeira's iOS port. Separate from the IPA build until the
# libraries link into the app.
on:
  push:
    branches: [main]
    paths: ["engine/wine/build-unix.sh", "engine/wine/PIN", "engine/wine/patches/**", ".github/workflows/wine-unix.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wine-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine-unix:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Host tools
        run: |
          brew install bison flex llvm ninja || true
          xcodebuild -version

      # Restore/save separately so partial progress (configure, deps) is kept
      # even when a later step fails.
      - name: Restore Madeira checkout, Wine build tree and iOS deps
        uses: actions/cache/restore@v4
        with:
          path: engine/wine/madeira
          key: wine-unix-${{ hashFiles('engine/wine/PIN') }}-v1-${{ github.run_id }}
          restore-keys: wine-unix-${{ hashFiles('engine/wine/PIN') }}-v1-

      - name: Fetch Madeira + Wine fork
        run: bash engine/wine/build-unix.sh fetch

      - name: Configure Wine (build-macos) + generated headers
        id: configure
        run: bash engine/wine/build-unix.sh configure

      - name: iOS dependencies (GnuTLS, FFmpeg, FreeType)
        id: deps
        continue-on-error: true
        run: bash engine/wine/build-unix.sh deps

      - name: ntdll unix
        id: ntdll
        continue-on-error: true
        run: bash engine/wine/build-unix.sh ntdll

      - name: win32u unix
        id: win32u
        continue-on-error: true
        run: bash engine/wine/build-unix.sh win32u

      - name: wineserver
        id: wineserver
        continue-on-error: true
        run: bash engine/wine/build-unix.sh wineserver

      - name: Collect
        if: always()
        run: |
          bash engine/wine/build-unix.sh collect || true
          {
            echo "## Wine unix side"
            echo "| step | result |"
            echo "|---|---|"
            echo "| deps | ${{ steps.deps.outcome }} |"
            echo "| ntdll | ${{ steps.ntdll.outcome }} |"
            echo "| win32u | ${{ steps.win32u.outcome }} |"
            echo "| wineserver | ${{ steps.wineserver.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.ntdll.outcome }}${{ steps.win32u.outcome }}${{ steps.wineserver.outcome }}" = successsuccesssuccess

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/wine/madeira
          key: wine-unix-${{ hashFiles('engine/wine/PIN') }}-v1-${{ github.run_id }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wine-unix-libs
          path: engine/wine/out
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wine-unix-logs
          path: |
            engine/wine/madeira/wine/build-macos/*.log
            engine/wine/madeira/build/*/obj/*.err
            engine/wine/obj-wineserver/*.err
          if-no-files-found: ignore

      - name: Rebuild the IPA with these libraries
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ipa.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
