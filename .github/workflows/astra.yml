name: Astra independent interpreter
on:
  push:
    branches: ['gpt-astra/**']
    paths: ['engine/astra/**', '.github/workflows/astra.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guest-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build unchanged x86 guests
        run: |
          bash engine/guest/build.sh "$RUNNER_TEMP/astra-guests"
          "$RUNNER_TEMP/astra-guests/hello.elf" > "$RUNNER_TEMP/astra-guests/hello-native.txt"
          objdump -d "$RUNNER_TEMP/astra-guests/bench_sse2.elf" > "$RUNNER_TEMP/astra-guests/bench-disassembly.txt"
          objdump -d "$RUNNER_TEMP/astra-guests/hello.elf" > "$RUNNER_TEMP/astra-guests/hello-disassembly.txt"
          bash engine/astra/probe-build.sh "$RUNNER_TEMP/astra-guests"
      - uses: actions/upload-artifact@v4
        with:
          name: astra-x86-fixtures
          path: ${{ runner.temp }}/astra-guests
  compare:
    needs: guest-fixtures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: astra-x86-fixtures
          path: ${{ runner.temp }}/astra-guests
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          chmod +x "$RUNNER_TEMP/astra-guests/"*.elf
      - name: Build Astra and native ARM driver
        run: bash engine/astra/build.sh "$RUNNER_TEMP/astra-bin"
      - name: Build unchanged FXI in the same job
        run: bash engine/fxi/build.sh "$RUNNER_TEMP/astra-fxi"
      - name: Instruction, fusion and failure probes
        run: |
          "$RUNNER_TEMP/astra-bin/safety"
          "$RUNNER_TEMP/astra-bin/astra" "$RUNNER_TEMP/astra-guests/astra-probe.elf" > "$RUNNER_TEMP/astra-probe.txt"
          diff -u "$RUNNER_TEMP/astra-guests/astra-probe-native.txt" "$RUNNER_TEMP/astra-probe.txt"
          ASTRA_NO_FUSION=1 "$RUNNER_TEMP/astra-bin/astra" "$RUNNER_TEMP/astra-guests/astra-probe.elf" > "$RUNNER_TEMP/astra-probe-unfused.txt"
          diff -u "$RUNNER_TEMP/astra-probe.txt" "$RUNNER_TEMP/astra-probe-unfused.txt"
      - name: Correctness and median performance
        run: bash engine/astra/ci-test.sh "$RUNNER_TEMP/astra-guests" "$RUNNER_TEMP/astra-bin/astra" "$RUNNER_TEMP/astra-fxi/fxi" "$RUNNER_TEMP/astra-bin/native" "$RUNNER_TEMP/astra-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-results-${{ matrix.os }}
          path: ${{ runner.temp }}/astra-results
  sanitizers:
    needs: guest-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: astra-x86-fixtures
          path: ${{ runner.temp }}/astra-guests
      - name: Build with address and undefined-behavior sanitizers
        env:
          ASTRA_EXTRA_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        run: bash engine/astra/build.sh "$RUNNER_TEMP/astra-sanitized"
      - name: Exercise loader errors, instructions and all kernel paths
        run: |
          "$RUNNER_TEMP/astra-sanitized/safety"
          "$RUNNER_TEMP/astra-sanitized/astra" "$RUNNER_TEMP/astra-guests/astra-probe.elf" > "$RUNNER_TEMP/astra-sanitized-probe.txt"
          diff -u "$RUNNER_TEMP/astra-guests/astra-probe-native.txt" "$RUNNER_TEMP/astra-sanitized-probe.txt"
          "$RUNNER_TEMP/astra-sanitized/astra" "$RUNNER_TEMP/astra-guests/hello.elf"
          for kernel in integer float memory branch simd; do
            "$RUNNER_TEMP/astra-sanitized/astra" "$RUNNER_TEMP/astra-guests/bench_sse2.elf" "$kernel" 1
            ASTRA_NO_FUSION=1 "$RUNNER_TEMP/astra-sanitized/astra" "$RUNNER_TEMP/astra-guests/bench_sse2.elf" "$kernel" 1
          done
  iphone-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile all engine sources for iOS arm64
        run: |
          mkdir -p "$RUNNER_TEMP/astra-ios"
          for source in astra decode vector fusion; do
            xcrun -sdk iphoneos clang -arch arm64 -O2 -ffp-contract=off -std=c++17 -c "engine/astra/$source.cpp" -o "$RUNNER_TEMP/astra-ios/$source.o"
          done
