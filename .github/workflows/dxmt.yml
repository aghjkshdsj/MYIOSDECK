name: Stage 3 - DXMT (Direct3D on Metal)

# Builds DXMT's iOS side (D3D9/10/11 -> Metal, shader converter on LLVM 15)
# as libdxmt_combined.a. LLVM is cached, so only the first run is long.
on:
  push:
    branches: [main]
    paths: ["engine/dxmt/**", ".github/workflows/dxmt.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dxmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dxmt:
    runs-on: macos-26
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: Host tools
        run: brew install ninja meson || true

      - name: Restore Madeira, DXMT and LLVM build
        uses: actions/cache/restore@v4
        with:
          path: engine/dxmt/madeira
          key: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-${{ github.run_id }}
          restore-keys: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-

      - name: Fetch Madeira + DXMT + LLVM 15 sources
        run: bash engine/dxmt/build-unix.sh fetch

      - name: LLVM 15 for iOS
        id: llvm
        timeout-minutes: 300
        run: bash engine/dxmt/build-unix.sh llvm

      - name: Metal toolchain
        id: metal
        run: bash engine/dxmt/build-unix.sh metal

      - name: DXMT iOS side
        id: dxmt
        run: bash engine/dxmt/build-unix.sh dxmt

      - name: Collect
        run: bash engine/dxmt/build-unix.sh collect

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/dxmt/madeira
          key: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-${{ github.run_id }}

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: dxmt-libs
          path: engine/dxmt/out

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dxmt-logs
          path: |
            engine/dxmt/madeira/toolchains/llvm-ios-ninja.log
            engine/dxmt/madeira/build/dxmt-ios/obj/*.err
          if-no-files-found: ignore
