# XcodeGen spec: `xcodegen generate` writes MYIOSDECK.xcodeproj (not committed).
name: MYIOSDECK
options:
  bundleIdPrefix: com.myiosdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Engine.xcconfig
  Release: Config/Engine.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      GCC_OPTIMIZATION_LEVEL: "3"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  MYIOSDECK:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        excludes:
          - "Native/bench.c"
          - "Native/heldout.c"
      - path: App/Sources/Native/bench.c
        # Same math as the x86-64 guest (no FMA contraction) so checksums compare exactly.
        compilerFlags: ["-O2", "-ffp-contract=off"]
      - path: App/Sources/Native/heldout.c
        # The held-out benchmark (engine/guest/heldout.c), built as CI builds its native side.
        compilerFlags: ["-O2", "-ffp-contract=off"]
      # FXI, the no-JIT x86-64 interpreter (docs/FAST_INTERPRETER.md). Always -O2, and no FMA
      # contraction so guest float results match x86.
      - path: engine/fxi
        excludes: ["fxi_main.c", "*.sh"]
        compilerFlags: ["-O2", "-ffp-contract=off"]
      # FXR, FXI with the guest registers pinned in host registers (experimental, Linux guests
      # only). Its copy of the FXI sources is renamed to fxr_* (engine/fxr/fxr_rename.h).
      - path: engine/fxr
        excludes: ["fxi_main.c", "native.c", "*.sh", "*.inc", "*.h"]   # headers stay out of the header map: FXI has the same names
        # No tail merging: each edge of a branch handler keeps its own indirect jump (fxr/build.sh).
        compilerFlags: ["-O2", "-ffp-contract=off", "-mllvm", "-enable-tail-merge=false"]
      # Stage 2 (Wine): engine/wine/stage-app.sh inserts Madeira's app-side sources
      # and the Windows side (DLL farm, NLS, prefix) here when it staged them.
      # @WINE_SOURCES@
      # Stage 3 (DXMT): engine/dxmt/stage-app.sh inserts Madeira's d3d12/ folder here.
      # @DXMT_SOURCES@
      - path: App/Resources
        buildPhase: resources
      # No-JIT spike: Windows DLLs wrapped as signed dylibs (engine/pedylib/link-dylibs.sh).
      - path: App/Generated/PE
        type: folder
        buildPhase: resources
        optional: true
      - path: App/Assets.xcassets
      - path: App/Info.plist
        buildPhase: none
      - path: App/MYIOSDECK.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: MYIOSDECK
        PRODUCT_BUNDLE_IDENTIFIER: com.myiosdeck.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MYIOSDECK.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/MYIOSDECK-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/App/Generated"
          - "$(SRCROOT)/engine/guest"
          - "$(SRCROOT)/engine/fxi"
          - "$(MYIOSDECK_FEX_HEADERS)"
          - "$(MYIOSDECK_WINE_HEADERS)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(MYIOSDECK_FEX_LIBS)"
          - "$(MYIOSDECK_BLINK_LIBS)"
          - "$(MYIOSDECK_WINE_LIBS)"
          - "$(MYIOSDECK_DXMT_LIBS)"
          - "-lc++"
          - "-lz"
          - "-llzma"
        # Signing happens at sideload time (iloader / SideStore / AltStore).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
